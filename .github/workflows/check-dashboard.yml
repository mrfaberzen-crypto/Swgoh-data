name: Test SWGOH dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "squads.js"
      - "scripts/check-squads.cjs"
      - "scripts/check-dashboard.mjs"
      - ".github/workflows/check-dashboard.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate dashboard scripts and squad allocations
        run: |
          node --check app.js
          node --check squads.js
          node scripts/check-squads.cjs
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Check dashboard in Chromium
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/dashboard-server.log 2>&1 &
          node scripts/check-dashboard.mjs
      - name: Save dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: dashboard-*.png
          if-no-files-found: ignore
