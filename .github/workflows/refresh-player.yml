name: Refresh SWGOH player data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-player.yml"
      - ".github/refresh-request.txt"
      - "scripts/**"
      - "index.html"
      - "app.js"
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-swgoh-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest SWGoH Comlink
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl --fail --silent --show-error --location https://api.github.com/repos/swgoh-utils/swgoh-comlink/releases/latest)"
          asset_url="$(jq -r '.assets[] | select(.name | test("^swgoh-comlink-linux-.*\\.tgz$")) | .browser_download_url' <<<"$release_json" | head -n 1)"
          test -n "$asset_url"
          curl --fail --silent --show-error --location "$asset_url" -o comlink.tgz
          mkdir -p .comlink
          tar -xzf comlink.tgz -C .comlink
          binary="$(find .comlink -type f -name 'swgoh-comlink*' | head -n 1)"
          test -n "$binary"
          chmod +x "$binary"
          echo "COMLINK_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Start Comlink
        shell: bash
        run: |
          set -euo pipefail
          "$COMLINK_BINARY" --name "Faberzen GitHub roster refresh" > comlink.log 2>&1 &
          echo $! > comlink.pid
          for attempt in {1..30}; do
            if curl --silent --fail --request POST http://127.0.0.1:3000/metadata >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat comlink.log
          exit 1

      - name: Refresh localized roster
        run: python3 scripts/refresh.py

      - name: Check dashboard in Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/dashboard-server.log 2>&1 &
          node scripts/check-dashboard.mjs

      - name: Save dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: dashboard-*.png
          if-no-files-found: ignore

      - name: Commit changed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player.json data/refresh.json data/dashboard.json data/unit-catalog.json
          if git diff --cached --quiet; then
            echo "Roster data is unchanged."
            exit 0
          fi
          git commit -m "Refresh SWGOH player data"
          git push
