name: Refresh SWGOH player data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-player.yml"
      - ".github/refresh-request.txt"
      - "scripts/**"
      - "index.html"
      - "app.js"
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-swgoh-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest SWGoH Comlink
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Authenticate API lookup to avoid the low anonymous GitHub API rate limit.
          release_json="$(curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/swgoh-utils/swgoh-comlink/releases/latest)"
          asset_url="$(jq -r '.assets[] | select(.name | test("^swgoh-comlink-linux-.*\\.tgz$")) | .browser_download_url' <<<"$release_json" | head -n 1)"
          if [ -z "$asset_url" ]; then
            echo "::error::No Linux Comlink .tgz asset found in the latest release."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 "$asset_url" -o comlink.tgz
          mkdir -p .comlink
          tar -xzf comlink.tgz -C .comlink
          binary="$(find .comlink -type f -name 'swgoh-comlink*' | head -n 1)"
          if [ -z "$binary" ]; then
            echo "::error::Comlink release archive did not contain the expected executable."
            exit 1
          fi
          chmod +x "$binary"
          echo "COMLINK_BINARY=$binary" >> "$GITHUB_ENV"

      - name: Start Comlink
        shell: bash
        run: |
          set -euo pipefail
          "$COMLINK_BINARY" --name "Faberzen GitHub roster refresh" > comlink.log 2>&1 &
          echo $! > comlink.pid
          for attempt in {1..30}; do
            if curl --silent --fail --request POST http://127.0.0.1:3000/metadata >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat comlink.log
          exit 1

      - name: Refresh localized roster
        run: python3 scripts/refresh.py

      - name: Validate refreshed roster before publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/dashboard.json").read_text())
          units = data.get("units", [])
          assert str(data.get("allyCode")) == "843153117", "Unexpected ally code"
          assert len(units) >= 100, "Roster unexpectedly small"
          assert all(u.get("type") in ("Character", "Ship") for u in units), "Unknown unit type"
          assert all(u.get("name") and u.get("name") != u.get("id") for u in units), "Unknown unit name"
          assert data.get("refreshedAt"), "Missing roster refresh timestamp"
          print("Validated", len(units), "units at", data["refreshedAt"])
          PY

      - name: Commit changed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/player.json data/refresh.json data/dashboard.json data/unit-catalog.json
          if git diff --cached --quiet; then
            echo "Roster data is unchanged."
            exit 0
          fi
          git commit -m "Refresh SWGOH player data"
          git push
