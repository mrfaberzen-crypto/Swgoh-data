# Cloudflare Workers Builds: select GitHub repo mrfaberzen-crypto/Swgoh-data
# and set Root directory to "worker".
# This deploys the existing Worker named swgoh-data instead of creating a new one.
name = "swgoh-data"
main = "index.js"
compatibility_date = "2026-10-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Keep Cloudflare Builds root directory set to worker; Git pushes to main deploy this Worker.

# Limits anonymous roster refresh to 2 requests per minute per Cloudflare edge.
# A separate 30-minute global cooldown checks GitHub run history in index.js.
[[ratelimits]]
name = "ROSTER_REFRESH_LIMITER"
namespace_id = "843153117"
[ratelimits.simple]
limit = 2
period = 60
